services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped

  usiphu:
    build: .
    ports:
      - "8501:8501"
    environment:
      USIPHU_DB_PATH: /data/usiphu.sqlite3
      USIPHU_AUTH_REQUIRED: "true"
      OLLAMA_BASE_URL: http://ollama:11434
      USIPHU_OLLAMA_MODEL: ${USIPHU_OLLAMA_MODEL:-qwen2.5:7b}
      NCBI_EMAIL: ${NCBI_EMAIL:-}
      NCBI_API_KEY: ${NCBI_API_KEY:-}
    volumes:
      - usiphu-data:/data
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    depends_on:
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  usiphu-data:
  ollama-models:
