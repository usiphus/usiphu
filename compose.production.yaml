services:
  app:
    build: .
    image: usiphu:2.0
    environment:
      USIPHU_DB_PATH: /data/usiphu.sqlite3
      USIPHU_SOURCE_DIR: /source-inbox
      USIPHU_AUTH_REQUIRED: "true"
      TZ: ${TZ:-Africa/Cairo}
    volumes:
      - usiphu-data:/data
      - usiphu-sources:/source-inbox
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    expose: ["8501"]
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: [/tmp:size=64m,noexec,nosuid]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [private]
    mem_limit: 768m
    cpus: 1.5

  proxy:
    image: caddy:2.10-alpine
    environment:
      USIPHU_DOMAIN: ${USIPHU_DOMAIN:?Set USIPHU_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [private]
    mem_limit: 256m
    cpus: 0.5

  backup:
    image: usiphu:2.0
    profiles: ["backup"]
    entrypoint: ["python", "/scripts/backup_sqlite.py"]
    environment:
      USIPHU_DB_PATH: /data/usiphu.sqlite3
      USIPHU_SOURCE_DIR: /source-inbox
      USIPHU_BACKUP_DIR: /backups
      USIPHU_BACKUP_RETENTION_DAYS: "30"
    volumes:
      - usiphu-data:/data:ro
      - usiphu-sources:/source-inbox:ro
      - usiphu-backups:/backups
      - ./scripts:/scripts:ro
    networks: [private]

  restore:
    image: usiphu:2.0
    profiles: ["restore"]
    entrypoint: ["python", "/scripts/restore_backup.py"]
    environment:
      USIPHU_DB_PATH: /data/usiphu.sqlite3
      USIPHU_SOURCE_DIR: /source-inbox
    volumes:
      - usiphu-data:/data
      - usiphu-sources:/source-inbox
      - usiphu-backups:/backups:ro
      - ./scripts:/scripts:ro
    networks: [private]

volumes:
  usiphu-data:
  usiphu-sources:
  usiphu-backups:
  caddy-data:
  caddy-config:
networks:
  private:
    driver: bridge
