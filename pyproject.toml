[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usiphu"
version = "2.0.0"
description = "Structured medical learning and exam preparation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1.0", "uvicorn[standard]>=0.27,<1.0", "streamlit>=1.32,<2.0", "pydantic>=2.6,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.3"]

[tool.setuptools.packages.find]
include = ["usiphu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
